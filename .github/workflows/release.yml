name: Release Obsidian Plugin


on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.1). Do not include the "v" prefix.'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Update versions, Commit, and Tag
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          # Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # npm version triggers the "version" script in package.json
          # which runs version-bump.mjs and stages manifest.json and versions.json
          # We use --tag-version-prefix="" to create tag "1.0.1" instead of "v1.0.1"
          npm version $NEW_VERSION -m "chore: release %s" --tag-version-prefix="" --allow-same-version

          # Push commit and tag directly to main
          git push origin main
          git push origin $NEW_VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          files: |
            main.js
            manifest.json
            styles.css
          generate_release_notes: true
